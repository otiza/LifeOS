[project]
name = "life-os"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "samad", email = "onlytiza2001@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[project.scripts]
life-os = "life_os:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
